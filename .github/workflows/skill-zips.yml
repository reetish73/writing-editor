# Builds one ZIP per skill for Claude Desktop. Download from the run's "Artifacts" section.
name: skill-zips
on:
  push:
    branches: [main]
    paths: ["skills/**", "THIRD_PARTY.md", "licenses/**", "scripts/build_zips.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python scripts/build_zips.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: writing-editor-skills
          path: dist/*.zip
          retention-days: 30
